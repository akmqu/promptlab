name: Deploy FastAPI to Azure App Service

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/azure-deploy.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/azure-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6E1A6CCD7759451786C6BC453FE1B6FB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8403F88F22594C09846922A935EAA980 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4711635626374CDA91A5D8D187AEFFFC }}
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: promptlab-api-7x29
          package: backend
